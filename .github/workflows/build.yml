
name: Build Naruto Storm Revolution APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -o NarutoStormRevolution-source.zip -d extracted
  
          find extracted -name build.gradle -print

      - name: Build APK
        run: |
          cd extracted/NarutoStormRevolution
          gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NarutoStormRevolution-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/*.apk
